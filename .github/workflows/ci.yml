# Lance bin/ci (config/ci.rb) sur chaque PR et sur main : RuboCop, audits, Brakeman,
# bin/controles, tests, seeds. Les mêmes étapes qu'en local, dans le même ordre.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # ubuntu-latest est passé à 26.04. setup-ruby n'y publie que le dernier
    # correctif de chaque série (3.3.13), pas le 3.3.5 du projet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: bin/ci
        run: bin/ci
