# Les libellés français de la base. Une seule source : les vues appellent
# Order.human_enum_value(:status, :pending) ou order.human_enum(:status),
# jamais « En attente » écrit en dur.
# Le français est la langue par défaut (config/application.rb, issue #20).
fr:
  # Le nom du site : titre de l'onglet, logo de la barre et du pied de page.
  app_name: Ferme Directe

  # Les textes des partials partagés. Dans app/views/shared/_navbar.html.erb,
  # t(".needs") est une « recherche paresseuse » (lazy lookup) : Rails complète
  # la clé avec le chemin du fichier et lit shared.navbar.needs.
  shared:
    navbar:
      toggle: Ouvrir le menu
      listings: Annonces
      needs: Mes besoins
      orders: Mes commandes
      favorites: Fermes favorites
      notifications: Notifications
      role_switch: Choisir le mode
      buy: J'achète
      sell: Je vends
      account: Mon compte
    # Le menu du compte (story 14, app/views/shared/_sign_out_link.html.erb).
    sign_out_link:
      sign_out: Se déconnecter
    footer:
      tagline: De nouveaux débouchés pour les fermes françaises.
      platform: La plateforme
      how_it_works: Comment ça marche
      for_farms: Pour les fermes
      for_shops: Pour les commerces
      pricing: Tarifs
      help: Aide
      faq: Questions fréquentes
      contact: Nous écrire
      legal: Informations légales
      legal_notice: Mentions légales
      terms: Conditions générales de vente
      privacy: Politique de confidentialité
      cookies: Gestion des cookies
      mediation: Médiation de la consommation
      project: Projet de démonstration · Le Wagon, batch 2312
      hosting: Hébergement en France
    flashes:
      close: Fermer

  # Stories 5 et 6 : les messages après l'envoi (create) et l'acceptation (accept) d'une commande.
  orders:
    accept:
      success: Commande acceptée. L'acheteur est prévenu.
    create:
      success: Votre commande est envoyée. Elle attend la réponse de la ferme.
      failure: La commande n'a pas pu être envoyée. Vérifiez la quantité.
    # Story 5 (A04) : la page de la commande (orders/show) et son récapitulatif (orders/_summary).
    show:
      title: Commande %{reference}
      heading: Votre commande
      reference: Référence %{reference}
    purchase_order:
      reference: "Référence %{reference}"
      date: Date
      buyer: Acheteur
      seller: Ferme
      product: Produit
      quantity: Quantité
      quantity_value: "%{quantity} %{unit}"
      unit_price: Prix
      total: Total
    summary:
      title: Récapitulatif
      farm: Ferme
      product: Produit
      quantity: Quantité
      unit_price: Prix unitaire
      total: Total
      needed_on: Pour le
      fulfillment: Retrait ou livraison
      pickup_hours: Horaires de retrait
    status:
      pending:
        title: Et maintenant ?
        text: La ferme a reçu votre commande. Dès qu'elle l'accepte, vous recevez une notification et le bon de commande par e-mail.
      accepted:
        title: Bon de commande
        text: "Confirmée le %{timestamp}."
        download: Télécharger le bon de commande
      # Story 6 (V03) : les boutons de la ferme (orders/status/_seller_actions).
      seller_actions:
        title: Nouvelle commande
        text: "%{buyer} vous a envoyé cette commande. En l'acceptant, votre stock baisse et l'acheteur est prévenu."
        accept: Accepter la commande

  # Outil de démo (demo/_acceptance_button), affiché seulement si DEMO_MODE est défini.
  demo:
    acceptance_button:
      simulate: Simuler la réponse de la ferme

  activerecord:
    models:
      company: Entreprise
      user: Utilisateur
      address: Adresse
      product: Produit
      listing: Annonce
      discount_tier: Palier de remise
      favorite: Favori
      order: Commande
      notification: Notification
    attributes:
      address/kind:
        billing: Facturation
        delivery: Livraison
        pickup: Lieu d'enlèvement
      listing/kind:
        offer: Offre
        need: Besoin
      listing/status:
        active: En ligne
        closed: Terminée
      listing/nature:
        sale: Vente
        helping_hand: Entraide
      listing/storage:
        fresh: Frais
        dry: Sec
        frozen: Surgelé
      listing/priorities:
        label: Le label
        distance: La distance
        price: Le prix
      order/status:
        pending: En attente
        accepted: Acceptée
        declined: Refusée
        cancelled: Annulée
      order/fulfillment:
        pickup: Retrait à la ferme
        delivery: Livraison
      notification/kind:
        order_received: Commande reçue
        order_accepted: Commande acceptée
        order_declined: Commande refusée
        need_matched: Un acheteur cherche un produit que vous proposez
    # Story 6 : pourquoi une acceptation est refusée (Order#accept!).
    errors:
      models:
        order:
          not_pending: Cette commande n'est plus en attente.
          out_of_stock: Le stock de l'offre ne suffit plus pour cette commande.

  simple_form:
    labels:
      listing:
        new:
          product: Produit
          unit: Unité
          quantity: Quantité
          needed_on: Pour le
          address_id: Livraison ou Retrait
          radius_km: Dans un rayon de (km)
          max_price: Prix maximum par pièce (facultatif)
        create:
          needed_on: Pour le
          address_id: Livraison ou Retrait
          radius_km: Dans un rayon de (km)
          max_price: Prix maximum par pièce (facultatif)
    prompts:
      listing:
        label: Peu importe
        address_id: Choisir une addresse

  needs:
    new:
      title: De quoi avez-vous besoin ?
      subtitle: Décrivez ce que vous cherchez. Les fermes qui peuvent le fournir seront prévenues.
      max_price_text: Les fermes au-dessus ne seront pas prévenues.
      button_see_farm: Voir les fermes

  # Page d'accueil après connexion (story 14, app/views/pages/home.html.erb).
  pages:
    home:
      title: Commander à un producteur, aussi simple que chez le grossiste.
      eyebrow: La plateforme des professionnels de l'alimentation
      lead: >-
        Restaurateurs, boulangers, pâtissiers, primeurs, épiciers : le producteur qui a la viande,
        les œufs, les légumes ou la farine qu'il vous faut est peut-être tout près. Décrivez votre
        besoin, comparez les producteurs et leur prix, commandez. Sans un appel, sans un SMS.
      logo_alt: Ferme Directe, une ferme au toit de deux feuilles
      steps:
        label: Comment ça marche
        describe:
          title: Vous décrivez votre besoin
          text: Produit, quantité, date, rayon.
        choose:
          title: Vous choisissez un producteur
          text: Au prix qu'il fixe, sans négocier.
        order:
          title: Le bon de commande part tout seul
          text: En PDF, par e-mail, à vous et au producteur.
      buy:
        eyebrow: J'achète
        title: Je m'approvisionne
        text: Des produits bruts ou transformés, auprès des producteurs proches de chez vous. Une commande claire, un document, pas d'aller-retour.
        button: Décrire mon besoin
      sell:
        eyebrow: Je vends
        title: Je trouve des débouchés
        text: Les professionnels autour de vous vous trouvent, au prix que vous fixez. Vous acceptez la commande en un clic, le bon de commande est fait.
        button: Voir mes ventes
      roles:
        title: Un seul compte, deux rôles.
        text: Un producteur peut aussi acheter, une épicerie peut aussi vendre. Vous passez de l'un à l'autre en haut à droite, sans créer de second compte.
    soon:
      title: Pas encore ouvert.
      text: "Cette partie est en préparation. Les producteurs, eux, sont déjà là : commencez par décrire votre besoin."
      back: Retour à l'accueil

  order_mailer:
    confirmation:
      subject: "Bon de commande %{reference}"
      intro: "Le bon de commande %{reference} est confirmé."
      date: Date
      buyer: Acheteur
      seller: Ferme
      product: Produit
      quantity: Quantité
      quantity_value: "%{quantity} %{unit}"
      unit_price: Prix
      total: Total
      attachment: Le fichier PDF est joint à ce message.

  matches:
    index:
      title: Les fermes trouvées

  number:
    currency:
      format:
        unit: "€"
        delimiter: " "
        separator: ","
        precision: 2
        format: "%n %u"
