AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    - 'test/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 120
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
# Décision d'équipe du 12 nov. 2026 : la longueur des méthodes est un signal, pas un blocage.
# Au-delà de 12 lignes, RuboCop le signale (éditeur, journal de la CI) sans faire échouer la CI :
# les remarques de niveau info ne changent pas le code de sortie. À relire : la méthode fait-elle
# plusieurs choses ? Un filtre qui devrait être dans la requête ? Le repère de 10 lignes vient du
# guide de style Ruby ; la config officielle de Rails (rubocop-rails-omakase) ne l'active pas.
Metrics/MethodLength:
  Max: 12
  Severity: info
